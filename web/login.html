<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="logo-huo.svg" />
    <title>Lantern · 登录</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 120% at 50% 0%, #2b2d31, #0d0e0f);
        font-family: -apple-system, "PingFang SC", sans-serif; color: #fff;
      }
      .card {
        width: 320px; max-width: 88vw; background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 28px 22px; text-align: center;
        backdrop-filter: blur(20px);
      }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { color: #9a9aa2; font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
      input {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: none; font-size: 15px;
        margin-bottom: 12px; background: #fff; color: #1d1d1f;
      }
      #code { letter-spacing: 6px; text-align: center; font-size: 20px; }
      button {
        width: 100%; padding: 12px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600;
        background: #0a84ff; color: #fff; cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      .link { background: none; color: #9a9aa2; font-weight: 400; font-size: 13px; padding: 8px; margin-top: 4px; }
      .err { color: #ff6b6b; font-size: 13px; min-height: 18px; margin-top: 8px; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>📖 Reading Companion</h1>

      <!-- 邮箱模式 · 第一步：Google 登录（主）+ 邮箱验证码（兜底） -->
      <div id="stepEmail" hidden>
        <button id="googleBtn" hidden style="background:#fff;color:#1d1d1f;display:flex;align-items:center;justify-content:center;gap:10px;">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Sign in with Google
        </button>
        <div id="orDivider" hidden style="color:#6a6a72;font-size:12px;margin:12px 0;">or use email</div>
        <p>Enter your email — we'll send you a 6-digit code.</p>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" autofocus />
        <button id="sendBtn">Send code</button>
      </div>

      <!-- 邮箱模式 · 第二步：输验证码 -->
      <div id="stepCode" hidden>
        <p>Code sent to <b id="emailEcho"></b>. Enter it below.</p>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" />
        <button id="verifyBtn">Verify &amp; enter</button>
        <button class="link" id="backBtn">Use a different email</button>
      </div>

      <!-- 邀请码模式（回退） -->
      <div id="stepInvite" hidden>
        <p>Enter your invite code</p>
        <input id="pw" type="password" placeholder="Invite code" />
        <button id="inviteBtn">Enter</button>
      </div>

      <div class="err" id="err"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const err = (m) => ($('err').textContent = m || '');
      const show = (id) => {
        for (const s of ['stepEmail', 'stepCode', 'stepInvite']) $(s).hidden = s !== id;
        err('');
      };

      // 邮箱模式
      async function sendCode() {
        const email = $('email').value.trim();
        if (!email) return err('Please enter your email');
        $('sendBtn').disabled = true;
        err('');
        try {
          const r = await fetch('/auth/request', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }),
          });
          const j = await r.json().catch(() => ({}));
          if (r.ok && j.ok) {
            $('emailEcho').textContent = email;
            show('stepCode');
            setTimeout(() => $('code').focus(), 50);
          } else {
            err(j.error || 'Failed to send. Try again in a bit.');
          }
        } catch {
          err('Network error');
        } finally {
          $('sendBtn').disabled = false;
        }
      }
      async function verifyCode() {
        const email = $('email').value.trim();
        const code = $('code').value.trim();
        if (code.length < 6) return err('Enter the 6-digit code');
        $('verifyBtn').disabled = true;
        err('');
        try {
          const r = await fetch('/auth/verify', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, code }),
          });
          const j = await r.json().catch(() => ({}));
          if (r.ok && j.ok) location.href = '/';
          else err(j.error || 'Wrong or expired code');
        } catch {
          err('Network error');
        } finally {
          $('verifyBtn').disabled = false;
        }
      }

      // 邀请码模式
      async function loginInvite() {
        const pw = $('pw').value;
        const r = await fetch('/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }),
        });
        if (r.ok) location.href = '/';
        else err('Wrong code');
      }

      // 据后端模式选界面
      fetch('/status')
        .then((r) => r.json())
        .then((s) => {
          if (s.authMode === 'email') {
            show('stepEmail');
            $('email').focus();
          } else {
            show('stepInvite');
            $('pw').focus();
          }
        })
        .catch(() => show('stepInvite'));

      $('sendBtn').onclick = sendCode;
      $('verifyBtn').onclick = verifyCode;
      $('backBtn').onclick = () => show('stepEmail');
      $('inviteBtn').onclick = loginInvite;
      $('email').addEventListener('keydown', (e) => e.key === 'Enter' && sendCode());
      $('code').addEventListener('keydown', (e) => e.key === 'Enter' && verifyCode());
      $('pw').addEventListener('keydown', (e) => e.key === 'Enter' && loginInvite());
    </script>

    <script type="module">
      // Google 登录：用 supabase-js 完成 OAuth，拿到 session 后把 access_token 交给后端换我们的签名 cookie。
      // Google 不可用（未配置 / CDN 挂）就静默退回邮箱验证码。
      (async () => {
        try {
          const s = await (await fetch('/status')).json();
          if (!(s.authMode === 'email' && s.supabaseUrl && s.supabaseAnonKey)) return;
          const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
          const supabase = createClient(s.supabaseUrl, s.supabaseAnonKey);
          // 从 Google 跳回来：完成 session → 交后端 → 进站
          const { data: { session } } = await supabase.auth.getSession();
          if (session?.access_token) {
            const r = await fetch('/auth/session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ access_token: session.access_token }),
            });
            if (r.ok) location.href = '/';
            return;
          }
          // 亮出 Google 按钮
          document.getElementById('googleBtn').hidden = false;
          document.getElementById('orDivider').hidden = false;
          document.getElementById('googleBtn').onclick = () =>
            supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/login' } });
        } catch (e) {
          console.warn('google login unavailable', e);
        }
      })();
    </script>
  </body>
</html>
